<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){const s=localStorage.getItem('pv_theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',s);})();</script>
  <link rel="icon" type="image/png" href="imgs/logo-nobg.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account — Print Vatika</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .auth-page {
      background: var(--parchment);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .auth-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4rem 1.5rem;
    }
    .auth-card {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .auth-tabs {
      display: flex;
      border-bottom: 1.5px solid var(--border);
      margin-bottom: 0.5rem;
    }
    .auth-tab {
      flex: 1;
      padding: 0.75rem;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-mute);
      text-align: center;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
    }
    .auth-tab.active {
      color: var(--ink);
      border-bottom-color: var(--cyan);
    }
    .oauth-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      width: 100%;
      padding: 0.85rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--white);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .oauth-btn:hover {
      background: var(--parchment);
      border-color: var(--ink);
    }
    .oauth-icon {
      width: 18px;
      height: 18px;
    }
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--ink-mute);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1.5px solid var(--border);
    }
    .divider:not(:empty)::before { margin-right: 1rem; }
    .divider:not(:empty)::after { margin-left: 1rem; }
    
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
  </style>

  <!-- Open Graph / Social Media Meta Tags -->
  <meta property="og:title" content="Print Vatika � Premium Printing Press & Custom Print Shop">
  <meta property="og:description" content="Configure business cards, custom t-shirts, flex banners, flyers, posters, and stickers online. Premium Lado Sarai press in New Delhi.">
  <meta property="og:image" content="https://printvatika.vercel.app/imgs/og-image.jpg">
  <meta property="og:url" content="https://printvatika.vercel.app">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body class="auth-page">

  <header class="site-header" id="site-header"></header>

  <div class="auth-container">
    <div class="auth-card">
      <div>
        <div style="display:flex;align-items:center;gap:.6rem;margin-bottom:.35rem;">
          <div class="brand-mark">PV</div>
          <span style="font-family:var(--font-serif);font-size:1.3rem;font-weight:900;">Print Vatika</span>
        </div>
        <div id="auth-title-desc" style="font-size:.72rem;color:var(--ink-mute);font-weight:600;text-transform:uppercase;letter-spacing:.08em;">Sign in to your account</div>
      </div>

      <!-- OAuth Login Options -->
      <button onclick="loginWithGoogle()" class="oauth-btn">
        <svg class="oauth-icon" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continue with Google
      </button>

      <div class="divider">Or use email</div>

      <!-- Tab selection -->
      <div class="auth-tabs">
        <button id="tab-btn-login" class="auth-tab active" onclick="setAuthMode('login')">Sign In</button>
        <button id="tab-btn-register" class="auth-tab" onclick="setAuthMode('register')">Register</button>
      </div>

      <!-- Sign In Form -->
      <form id="login-form" class="auth-form" onsubmit="handleEmailLogin(event)">
        <div class="form-field">
          <label class="form-label">Email Address</label>
          <input type="email" id="login-email" class="form-input" placeholder="you@email.com" required>
        </div>
        <div class="form-field">
          <label class="form-label">Password</label>
          <input type="password" id="login-pw" class="form-input" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;padding:0.85rem;" id="login-submit-btn">Sign In →</button>
      </form>

      <!-- Register Form -->
      <form id="register-form" class="auth-form" style="display:none;" onsubmit="handleEmailRegister(event)">
        <div class="form-field">
          <label class="form-label">Full Name</label>
          <input type="text" id="reg-name" class="form-input" placeholder="Anil Kumar" required>
        </div>
        <div class="form-field">
          <label class="form-label">Email Address</label>
          <input type="email" id="reg-email" class="form-input" placeholder="you@email.com" required>
        </div>
        <div class="form-field">
          <label class="form-label">Password</label>
          <input type="password" id="reg-pw" class="form-input" placeholder="Min 6 characters" minlength="6" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;padding:0.85rem;" id="reg-submit-btn">Create Account →</button>
      </form>
    </div>
  </div>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="env.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/utils.js"></script>
  <script>
    let currentMode = 'login';

    window.addEventListener('DOMContentLoaded', async () => {
      renderHeader('');
      renderFooter();
      await loadSettings();

      // Check if user is already logged in
      const { data: { session } } = await db.auth.getSession();
      if (session) {
        showToast('Already signed in. Redirecting...', 'info');
        setTimeout(() => location.href = 'index.html', 1000);
      }
    });

    function setAuthMode(mode) {
      currentMode = mode;
      document.getElementById('tab-btn-login').classList.toggle('active', mode === 'login');
      document.getElementById('tab-btn-register').classList.toggle('active', mode === 'register');
      
      document.getElementById('login-form').style.display = mode === 'login' ? 'flex' : 'none';
      document.getElementById('register-form').style.display = mode === 'register' ? 'flex' : 'none';
      
      document.getElementById('auth-title-desc').textContent = mode === 'login' 
        ? 'Sign in to your account' 
        : 'Create your printer account';
    }

    // ── GOOGLE OAUTH ──────────────────────────────
    async function loginWithGoogle() {
      // Direct OAuth login to Google using Supabase client
      // The redirect URL points back to login.html to parse tokens
      let redirectUrl = window.location.origin;
      if (window.location.pathname) {
        const parts = window.location.pathname.split('/');
        parts[parts.length - 1] = 'login.html';
        redirectUrl += parts.join('/');
      } else {
        redirectUrl += '/login.html';
      }

      // Handle local testing file paths protocol
      if (window.location.protocol === 'file:') {
        alert('Google Google OAuth requires HTTP/HTTPS protocol. Please run on NextJS (localhost:3000) or open with a local web server (e.g. VS Code Live Server).');
        return;
      }

      const { error } = await db.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: redirectUrl
        }
      });
      if (error) {
        showToast('Google login error: ' + error.message, 'error');
      }
    }

    // ── EMAIL AUTH ────────────────────────────────
    async function handleEmailLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-pw').value;
      const btn = document.getElementById('login-submit-btn');
      
      btn.disabled = true; btn.textContent = 'Signing in...';

      const { data, error } = await db.auth.signInWithPassword({ email, password });
      
      btn.disabled = false; btn.textContent = 'Sign In →';

      if (error) {
        showToast(error.message, 'error');
      } else {
        showToast('Welcome back!', 'success');
        setTimeout(() => {
          const params = new URLSearchParams(location.search);
          const dest = params.get('returnTo') || (params.get('ref') === 'cart' ? 'cart.html' : 'index.html');
          location.href = dest;
        }, 800);
      }
    }

    async function handleEmailRegister(e) {
      e.preventDefault();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-pw').value;
      const name = document.getElementById('reg-name').value.trim();
      const btn = document.getElementById('reg-submit-btn');
      
      btn.disabled = true; btn.textContent = 'Registering...';

      const { data, error } = await db.auth.signUp({
        email,
        password,
        options: {
          data: {
            full_name: name
          }
        }
      });
      
      btn.disabled = false; btn.textContent = 'Create Account →';

      if (error) {
        showToast(error.message, 'error');
      } else {
        showToast('Registration successful! Please check your email for confirmation.', 'success');
        setAuthMode('login');
      }
    }
  </script>
</body>
</html>
