<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){const s=localStorage.getItem('pv_theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',s);})();</script>
  <link rel="icon" type="image/png" href="imgs/logo-nobg.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart & Checkout — Print Vatika</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <!-- Open Graph / Social Media Meta Tags -->
  <meta property="og:title" content="Print Vatika — Premium Printing Press & Custom Print Shop">
  <meta property="og:description" content="Configure business cards, custom t-shirts, flex banners, flyers, posters, and stickers online. Premium Lado Sarai press in New Delhi.">
  <meta property="og:image" content="https://printvatika.vercel.app/imgs/og-image.jpg">
  <meta property="og:url" content="https://printvatika.vercel.app/cart.html">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <style>
    /* Cart Custom Enhancements */
    .cart-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cart-clear-btn {
      background: none;
      border: none;
      font-size: 0.75rem;
      font-weight: 700;
      color: #EF4444;
      cursor: pointer;
      padding: 0.2rem 0.5rem;
      border-radius: var(--radius-sm);
      transition: background 0.15s;
    }
    .cart-clear-btn:hover {
      background: #FEE2E2;
    }
    .cart-item-meta {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .cart-file-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.7rem;
      color: var(--cyan-dark);
      background: #E0F2FE;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 600;
      width: fit-content;
    }
    .art-preview-btn {
      font-size: 0.72rem;
      color: var(--cyan-dark);
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      text-align: left;
    }
    .art-preview-btn:hover {
      color: var(--ink);
    }
    .coupon-box {
      background: var(--parchment);
      border: 1px dashed var(--border);
      border-radius: var(--radius-sm);
      padding: 0.85rem 1rem;
      margin-top: 0.75rem;
    }
    .coupon-form {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.4rem;
    }
    .coupon-input {
      flex: 1;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .coupon-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.5rem;
    }
    .coupon-chip {
      font-size: 0.68rem;
      font-weight: 700;
      background: var(--white);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .coupon-chip:hover {
      border-color: var(--cyan);
      color: var(--cyan-dark);
      background: #F0F9FF;
    }
    .coupon-applied-tag {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #DCFCE7;
      color: #15803D;
      border: 1px solid #86EFAC;
      border-radius: var(--radius-sm);
      padding: 0.5rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 700;
      margin-top: 0.5rem;
    }
    .rush-box {
      background: #FFFBEB;
      border: 1px solid #FCD34D;
      border-radius: var(--radius-sm);
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      margin-top: 0.75rem;
    }
    .rush-box label {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.82rem;
      font-weight: 700;
      color: #92400E;
    }
    .delivery-eta-strip {
      background: #F8FAFC;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.65rem 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.78rem;
      color: var(--ink-soft);
      margin-top: 0.75rem;
    }
    .trust-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
    .trust-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.72rem;
      color: var(--ink-mute);
      font-weight: 600;
    }
    .trust-item svg {
      color: var(--cyan);
      flex-shrink: 0;
    }
    .empty-cart-card {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 4rem 2rem;
      text-align: center;
      max-width: 800px;
      margin: 0 auto;
    }
    .empty-quick-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-top: 2.5rem;
      text-align: left;
    }
    .empty-quick-item {
      background: var(--parchment);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }
    .empty-quick-item:hover {
      transform: translateY(-2px);
      border-color: var(--cyan);
    }
    .empty-quick-img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      border-radius: var(--radius-sm);
    }
    .empty-quick-name {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--ink);
    }
    .empty-quick-price {
      font-size: 0.75rem;
      color: var(--cyan-dark);
      font-weight: 700;
    }
    /* Lightbox Modal */
    .lightbox-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(4px);
      z-index: 99999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .lightbox-inner {
      background: var(--white);
      border-radius: var(--radius-md);
      max-width: 600px;
      width: 100%;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      position: relative;
    }
    .lightbox-img {
      max-width: 100%;
      max-height: 70vh;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      object-fit: contain;
      background: #F8FAFC;
    }
    .b2b-toggle-btn {
      background: none;
      border: none;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--cyan-dark);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <div class="cart-page">
    <div class="cart-layout" id="cart-layout"><!-- injected --></div>
  </div>

  <!-- UPI / Payment Modal -->
  <div id="pay-modal" style="display:none;" class="modal-bg">
    <div class="modal-card" id="pay-modal-inner"></div>
  </div>

  <!-- Artwork Preview Lightbox -->
  <div id="art-lightbox" class="lightbox-modal" onclick="closeLightbox(event)">
    <div class="lightbox-inner" onclick="event.stopPropagation()">
      <div style="width:100%;display:flex;justify-content:space-between;align-items:center;">
        <div class="heading-sm" id="lightbox-title">Design Artwork Preview</div>
        <button onclick="closeLightbox()" style="background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--ink-mute);">&times;</button>
      </div>
      <img id="lightbox-img" class="lightbox-img" src="" alt="Artwork Preview">
      <div id="lightbox-desc" class="body-xs" style="color:var(--ink-mute);text-align:center;"></div>
    </div>
  </div>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="env.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/utils.js"></script>
  <script>
  let fulfillment = 'pickup';
  let isExpressRush = false;
  let appliedCoupon = null;
  let showB2BFields = false;
  let currentCheckoutOrder = null;

  // Available discount coupons
  const AVAILABLE_COUPONS = {
    'FIRST10':   { type: 'percent', value: 10, label: '10% OFF Welcome Discount', minOrder: 0 },
    'WELCOME10': { type: 'percent', value: 10, label: '10% OFF Welcome Discount', minOrder: 0 },
    'VATIKA50':  { type: 'flat',    value: 50, label: '₹50 OFF on Orders > ₹500', minOrder: 500 },
    'FREEDEL':   { type: 'delivery',value: 50, label: 'Free Porter Delivery',     minOrder: 300 },
    'BULK100':   { type: 'flat',    value: 100,label: '₹100 OFF on Orders > ₹1000',minOrder: 1000 },
  };

  window.addEventListener('DOMContentLoaded', async () => {
    renderHeader('cart');
    renderFooter();
    await loadSettings();
    await loadProducts();
    await renderCart();
  });

  // Calculate ETA Date string
  function getEstimatedETA() {
    const d = new Date();
    if (isExpressRush) {
      d.setDate(d.getDate() + 0);
      return 'Today by 7:30 PM (Priority Rush Print)';
    } else {
      d.setDate(d.getDate() + 1);
      return 'Tomorrow by 4:00 PM (Standard Turnaround)';
    }
  }

  async function renderCart() {
    let userFullName = '';
    let userEmail = '';
    let userPhone = '';
    try {
      const { data: { session } } = await db.auth.getSession();
      if (session) {
        userFullName = session.user.user_metadata?.full_name || '';
        userEmail = session.user.email || '';
        userPhone = session.user.user_metadata?.phone || session.user.phone || '';
      }
    } catch(e) {}

    const items = Cart.get();
    const layout = document.getElementById('cart-layout');
    if (!layout) return;

    if (items.length === 0) {
      const featured = (window.PRODUCTS || []).slice(0, 4);
      layout.innerHTML = `
        <div style="grid-column:1/-1;">
          <div class="empty-cart-card">
            <div style="font-size:3.5rem;margin-bottom:1rem;line-height:1;">🛒</div>
            <h2 class="heading-lg" style="margin-bottom:.5rem;">Your Cart is Empty</h2>
            <p class="body-sm" style="color:var(--ink-mute);max-width:440px;margin:0 auto 1.5rem;">
              You haven't added any customised print jobs yet. Configure business cards, flex banners, or t-shirts to get started!
            </p>
            <a href="catalog.html" class="btn btn-primary btn-lg">Explore Full Catalog →</a>

            <div class="empty-quick-grid">
              ${featured.map(p => `
                <div class="empty-quick-item" onclick="location.href='product.html?slug=${p.slug}'">
                  <img class="empty-quick-img" src="${p.image}" alt="${p.name}">
                  <div class="empty-quick-name">${p.name}</div>
                  <div class="empty-quick-price">From ₹${fmt(p.basePrice)}</div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
      return;
    }

    const subtotal = Cart.subtotal();
    let delivery = fulfillment === 'delivery' ? 50 : 0;
    const rushFee = isExpressRush ? 99 : 0;

    // Calculate discount
    let discount = 0;
    let couponLabel = '';
    if (appliedCoupon && AVAILABLE_COUPONS[appliedCoupon]) {
      const c = AVAILABLE_COUPONS[appliedCoupon];
      if (subtotal >= c.minOrder) {
        if (c.type === 'percent') {
          discount = Math.round((subtotal * c.value) / 100);
          couponLabel = `${c.value}% OFF (${appliedCoupon})`;
        } else if (c.type === 'flat') {
          discount = Math.min(subtotal, c.value);
          couponLabel = `₹${c.value} OFF (${appliedCoupon})`;
        } else if (c.type === 'delivery') {
          if (delivery > 0) {
            discount = delivery;
            couponLabel = `Free Delivery (${appliedCoupon})`;
          }
        }
      } else {
        appliedCoupon = null; // Auto-cancel if minimum condition not met
      }
    }

    const total = Math.max(0, subtotal + delivery + rushFee - discount);

    layout.innerHTML = `
      <!-- Items column -->
      <div>
        <div class="section-box">
          <div class="section-box-header cart-header-row">
            <span>Your Print Items (${items.length} item${items.length!==1?'s':''})</span>
            <button class="cart-clear-btn" onclick="clearCartAll()">Clear All</button>
          </div>
          ${items.map(item => {
            const tags = Object.entries(item.options||{}).filter(([,v])=>v).map(([k,v])=>`<span class="cart-tag">${k}: ${v}</span>`).join('');
            const dimTag = item.dims ? `<span class="cart-tag">${item.dims.w}×${item.dims.h} ft</span>` : '';
            const previewSrc = item.preview || item.product?.image || 'imgs/logo-nobg.png';
            const fileName = item.file?.name ? `<div class="cart-file-tag">📄 ${escapeHtml(item.file.name)}</div>` : '';
            
            return `<div class="cart-item">
              <div style="display:flex;flex-direction:column;align-items:center;gap:0.4rem;">
                <img class="cart-thumb" src="${previewSrc}" alt="${item.product?.name || 'Custom Print'}" style="cursor:pointer;" onclick="openLightbox('${previewSrc}', '${escapeHtml(item.product?.name || 'Item')}')">
                ${item.preview ? `<button type="button" class="art-preview-btn" onclick="openLightbox('${previewSrc}', '${escapeHtml(item.product?.name || 'Item')}')">View Art</button>` : ''}
              </div>
              <div class="cart-item-info">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;">
                  <a href="product.html?slug=${item.product?.slug || ''}" class="cart-item-name" style="text-decoration:none;">${item.product?.name || 'Custom Print Item'}</a>
                </div>
                <div class="cart-item-meta">
                  <div class="cart-tags">${dimTag}${tags}</div>
                  ${fileName}
                </div>
                <div class="cart-qty-ctrl">
                  <button class="qty-ctrl-btn" onclick="adjQty('${item.id}', -1)" title="Decrease Quantity">−</button>
                  <div class="qty-display">${item.qty}</div>
                  <button class="qty-ctrl-btn" onclick="adjQty('${item.id}', 1)" title="Increase Quantity">+</button>
                  <div class="cart-item-price" style="margin-left:.75rem;">₹${fmt(item.price)}</div>
                  <span style="font-size:0.7rem;color:var(--ink-mute);margin-left:auto;">
                    <a href="product.html?slug=${item.product?.slug || ''}" style="color:var(--cyan-dark);text-decoration:underline;">Re-configure</a>
                  </span>
                </div>
              </div>
              <button class="cart-remove" title="Remove item" onclick="rmItem('${item.id}')">&times;</button>
            </div>`;
          }).join('')}
        </div>

        <!-- Express Rush Option & ETA Banner -->
        <div class="delivery-eta-strip">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="color:var(--cyan);flex-shrink:0;"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <div><strong>Estimated Turnaround:</strong> <span id="eta-text">${getEstimatedETA()}</span></div>
        </div>

        <div class="rush-box" onclick="toggleRushPrint()">
          <label>
            <input type="checkbox" id="rush-check" ${isExpressRush?'checked':''} onchange="toggleRushPrint(event)">
            <span>⚡ <strong>Same-Day Rush Priority Print (+₹99)</strong><br><small style="font-weight:normal;color:#78350F;">Jump to the front of the print queue at our Lado Sarai press.</small></span>
          </label>
        </div>

        <!-- Trust Badges Strip -->
        <div class="trust-grid">
          <div class="trust-item">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <span>100% Quality Guaranteed</span>
          </div>
          <div class="trust-item">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
            <span>Porter Tracked Express</span>
          </div>
          <div class="trust-item">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <span>256-Bit Razorpay &amp; UPI</span>
          </div>
          <div class="trust-item">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span>Live WhatsApp Updates</span>
          </div>
        </div>
      </div>

      <!-- Checkout column -->
      <div>
        <div class="section-box">
          <div class="section-box-header">Contact &amp; Fulfillment</div>
          <form class="checkout-form" id="checkout-form" onsubmit="submitOrder(event)">
            <div class="form-field">
              <label class="form-label">Full Name *</label>
              <input id="f-name" type="text" class="form-input" placeholder="Your full name" value="${escapeHtml(userFullName)}" required>
            </div>
            <div class="form-row">
              <div class="form-field">
                <label class="form-label">Phone (WhatsApp) *</label>
                <input id="f-phone" type="tel" class="form-input" placeholder="10-digit mobile" value="${escapeHtml(userPhone)}" required>
              </div>
              <div class="form-field">
                <label class="form-label">Email Address *</label>
                <input id="f-email" type="email" class="form-input" placeholder="you@example.com" value="${escapeHtml(userEmail)}" required>
              </div>
            </div>

            <div class="form-field">
              <label class="form-label">Fulfilment Option</label>
              <div class="fulfillment-tabs">
                <button type="button" id="tab-pickup"   class="fulfillment-tab ${fulfillment==='pickup'?'active':''}" onclick="setFF('pickup')">Pickup (Free)</button>
                <button type="button" id="tab-delivery" class="fulfillment-tab ${fulfillment==='delivery'?'active':''}" onclick="setFF('delivery')">Porter Delivery (+₹50)</button>
              </div>
            </div>

            <div id="pickup-info" style="${fulfillment==='pickup'?'display:block;':'display:none;'}">
              <div class="pickup-info">
                <strong>📍 Shop Pickup:</strong> F-298, Himmat Singh Marg, Near Saket Metro Station, Lado Sarai, New Delhi – 110030<br>
                <span style="color:var(--ink-mute);font-size:0.72rem;">Open Mon–Sat 9AM–8PM · Sunday 10AM–5PM</span>
              </div>
            </div>

            <div id="delivery-fields" style="${fulfillment==='delivery'?'display:flex;':'display:none;'}flex-direction:column;gap:.6rem;">
              <div class="form-field">
                <label class="form-label">Street Address *</label>
                <input id="f-addr" type="text" class="form-input" placeholder="House/Flat No., Building, Street">
              </div>
              <div class="form-row">
                <div class="form-field">
                  <label class="form-label">City *</label>
                  <input id="f-city" type="text" class="form-input" placeholder="New Delhi" value="Delhi">
                </div>
                <div class="form-field">
                  <label class="form-label">Pincode *</label>
                  <input id="f-pin"  type="text" class="form-input" placeholder="6-digit PIN" maxlength="6">
                </div>
              </div>
            </div>

            <!-- Optional GSTIN / B2B Section -->
            <div>
              <button type="button" class="b2b-toggle-btn" onclick="toggleB2BFields()">
                <span>🏢 ${showB2BFields ? '▼ Hide GST / Company Details' : '▶ Add GSTIN for Business Tax Invoice (Optional)'}</span>
              </button>
              <div id="b2b-fields" style="${showB2BFields ? 'display:flex;' : 'display:none;'}flex-direction:column;gap:0.6rem;margin-top:0.5rem;background:#F8FAFC;padding:0.75rem;border-radius:var(--radius-sm);border:1px solid var(--border);">
                <div class="form-field">
                  <label class="form-label">Company / Business Name</label>
                  <input id="f-company" type="text" class="form-input" placeholder="e.g. Acme Studio Pvt Ltd">
                </div>
                <div class="form-field">
                  <label class="form-label">GSTIN Number</label>
                  <input id="f-gstin" type="text" class="form-input" placeholder="15-digit GSTIN (e.g. 07AAAAA0000A1Z5)" maxlength="15" style="text-transform:uppercase;">
                </div>
              </div>
            </div>

            <div class="form-field">
              <label class="form-label">Notes for Press Operator</label>
              <textarea id="f-notes" class="form-input" rows="2" placeholder="e.g. Urgent morning delivery, matte cut, high contrast…"></textarea>
            </div>

            <!-- Coupon Code Box -->
            <div class="coupon-box">
              <label class="form-label" style="display:block;margin-bottom:0.2rem;">Apply Promo Code / Coupon</label>
              <div class="coupon-form">
                <input id="coupon-inp" type="text" class="form-input coupon-input" placeholder="Enter coupon code" value="${appliedCoupon || ''}">
                <button type="button" class="btn btn-primary btn-sm" onclick="applyCouponCode()">Apply</button>
              </div>
              <div class="coupon-chips">
                <span class="coupon-chip" onclick="quickApplyCoupon('FIRST10')">🏷️ FIRST10 (10% off)</span>
                <span class="coupon-chip" onclick="quickApplyCoupon('VATIKA50')">🏷️ VATIKA50 (₹50 off)</span>
                <span class="coupon-chip" onclick="quickApplyCoupon('FREEDEL')">🏷️ FREEDEL (Free Delivery)</span>
              </div>
              ${appliedCoupon ? `
                <div class="coupon-applied-tag">
                  <span>✓ <strong>${appliedCoupon}</strong> applied: -₹${fmt(discount)}</span>
                  <button type="button" onclick="removeCoupon()" style="background:none;border:none;color:#15803D;font-weight:800;cursor:pointer;font-size:1rem;">&times;</button>
                </div>
              ` : ''}
            </div>

            <!-- Summary Breakdown -->
            <div class="checkout-summary">

  // Adjust item quantity and recalculate pricing
  function adjQty(id, delta) {
    const items = Cart.get();
    const item  = items.find(i => i.id === id);
    if (!item) return;

    // Determine step size
    let step = 1;
    if (item.product?.slug === 'business-cards') step = 50;
    else if (item.product?.slug === 'flyers') step = 100;
    else if (item.product?.slug === 'stickers') step = 50;

    item.qty = Math.max(1, (item.qty || 1) + (delta * step));

    // Recalculate price accurately with bulk discounts & options
    if (window.calcPrice && item.product) {
      const calc = calcPrice(item.product, item.options || {}, item.qty, item.dims);
      item.price = calc.total;
    } else {
      // Fallback
      item.price = Math.round((item.price / (item.qty - delta * step)) * item.qty);
    }

    Cart.save(items);
    renderCart();
  }

  // Coupon Handlers
  function applyCouponCode() {
    const inp = document.getElementById('coupon-inp');
    const code = (inp?.value || '').trim().toUpperCase();
    if (!code) return;

    if (AVAILABLE_COUPONS[code]) {
      const c = AVAILABLE_COUPONS[code];
      const subtotal = Cart.subtotal();
      if (subtotal < c.minOrder) {
        alert(`Coupon ${code} requires a minimum order of ₹${c.minOrder}.`);
        return;
      }
      appliedCoupon = code;
      showToast(`Coupon ${code} applied successfully!`, 'success');
      renderCart();
    } else {
      alert('Invalid coupon code. Please try FIRST10 or VATIKA50.');
    }
  }

    const inp = document.getElementById('coupon-inp');

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  // ── SUBMIT ORDER ──────────────────────────────
  async function submitOrder(e) {
    e.preventDefault();
    const btn = document.getElementById('place-btn');

    // Mandatory Authentication Check
    let session = null;
    try {
      const authRes = await db.auth.getSession();
      session = authRes?.data?.session;
    } catch(err) {}

    if (!session || !session.user) {
      showAuthGateModal();
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Saving order…';

    const name  = (document.getElementById('f-name')?.value || '').trim();
    const phone = (document.getElementById('f-phone')?.value || '').trim();
    const email = (document.getElementById('f-email')?.value || '').trim();
    if (!name) { alert('Please enter your name.'); btn.disabled=false; btn.textContent='Proceed to Secure Payment →'; return; }
    if (phone.replace(/\D/g,'').length < 10) { alert('Please enter a valid 10-digit phone number.'); btn.disabled=false; btn.textContent='Proceed to Secure Payment →'; return; }
    if (!email) { alert('Please enter your email.'); btn.disabled=false; btn.textContent='Proceed to Secure Payment →'; return; }

    let address = 'Self-pickup at shop (Saket / Lado Sarai)';
    if (fulfillment === 'delivery') {
      const addr = document.getElementById('f-addr')?.value.trim();
      const city = document.getElementById('f-city')?.value.trim();
      const pin  = document.getElementById('f-pin')?.value.trim();
      if (!addr || !city || !pin) {
        alert('Please fill in your complete delivery street address, city, and pincode.');
        btn.disabled = false;
        btn.textContent = 'Proceed to Secure Payment →';
        return;
      }
      address = `${addr}, ${city} – ${pin}`;
    }

    const company = (document.getElementById('f-company')?.value || '').trim();
    const gstin   = (document.getElementById('f-gstin')?.value || '').trim();
    const userNotes = (document.getElementById('f-notes')?.value || '').trim();

    let combinedNotes = userNotes;
    if (isExpressRush) combinedNotes = `[PRIORITY SAME-DAY RUSH PRINT] ${combinedNotes}`;
    if (gstin) combinedNotes = `[GST INVOICE: ${company ? company + ' / ' : ''}${gstin}] ${combinedNotes}`;
    if (appliedCoupon) combinedNotes = `[COUPON: ${appliedCoupon}] ${combinedNotes}`;

    const items = Cart.get();
    const subtotal = Cart.subtotal();
    let delivery = fulfillment === 'delivery' ? 50 : 0;
    const rushFee = isExpressRush ? 99 : 0;

    let discount = 0;
    if (appliedCoupon && AVAILABLE_COUPONS[appliedCoupon]) {
      const c = AVAILABLE_COUPONS[appliedCoupon];
      if (c.type === 'percent') discount = Math.round((subtotal * c.value) / 100);
      else if (c.type === 'flat') discount = Math.min(subtotal, c.value);
      else if (c.type === 'delivery' && delivery > 0) discount = delivery;
    }

    const total = Math.max(0, subtotal + delivery + rushFee - discount);
    const orderId = await genOrderId();
    const userId = session.user.id;

    const order = {
      id:          orderId,
      user_id:     userId,
      name, phone, email,
      fulfillment, address,
      notes: combinedNotes,
      items: items.map(i => ({
        name: i.product?.name || 'Custom Print',
        qty: i.qty,
        options: i.options,
        dims: i.dims,
        price: i.price,
        preview: i.preview,
        file: i.file ? { name: i.file.name, size: i.file.size } : null
      })),
      subtotal,
      delivery: delivery + rushFee,
      total,
      payment: 'PENDING',
      status:  'PAYMENT_PENDING',
    };

    try {
      const { error } = await db.from('orders').insert(order);
      if (error) throw error;
      await db.from('order_history').insert({ order_id: orderId, status: 'PAYMENT_PENDING', note: 'Order placed by customer' });
    } catch (err) {
      console.error('Supabase error:', err);
      // Fall back to localStorage so order isn't lost
      const local = JSON.parse(localStorage.getItem('pv_orders_local')||'[]');
      local.unshift({ ...order, _local: true });
      localStorage.setItem('pv_orders_local', JSON.stringify(local));
      showToast('Order saved locally (offline mode)', 'info');
    }

    btn.disabled = false;
    currentCheckoutOrder = order;
    openPayModal(order);
  }

  // ── RAZORPAY HANDLER ──────────────────────────
  function payWithRazorpay(orderId, totalAmount, name, email, phone) {
    const options = {
      key: 'rzp_test_TSRQUFIenOSjSW', // test key
      amount: totalAmount * 100, // amount in paisa
      currency: 'INR',
      name: SETTINGS.shop_name || 'Print Vatika',
      description: 'Order Payment: ' + orderId,
      image: 'imgs/logo-nobg.png',
      handler: async function (response) {
        const payId = response.razorpay_payment_id;
        try {
          await db.from('orders').update({ payment: 'PAID', status: 'CONFIRMED', utr: payId }).eq('id', orderId);
          await db.from('order_history').insert({ order_id: orderId, status: 'CONFIRMED', note: 'Razorpay Online Payment. Ref: ' + payId });
        } catch(e) {
          console.error('Supabase update failed:', e);
        }
        Cart.clear();
        showSuccess(orderId, phone, 'Payment successful! Your order has been placed.');
      },
      prefill: {
        name: name,
        email: email,
        contact: phone
      },
      theme: {
        color: '#00B2EC' // Brand Cyan
      }
    };
    const rzp = new Razorpay(options);
    rzp.open();
  }

  async function confirmUTR(orderId, phone) {
    const utr = (document.getElementById('utr-inp')?.value||'').trim();
    if (!utr || utr.length < 6) { alert('Please enter a valid UTR / reference number.'); return; }
    try {
      await db.from('orders').update({ payment:'PAID', status:'CONFIRMED', utr }).eq('id', orderId);
      await db.from('order_history').insert({ order_id: orderId, status:'CONFIRMED', note:'UPI payment confirmed. UTR: '+utr });
    } catch(e) {
      console.error(e);
    }
    Cart.clear();
    showSuccess(orderId, phone, 'Payment submitted! We will verify the UTR and start printing.');
  }

  async function payAtShop(orderId, phone) {
    try {
      await db.from('orders').update({ status:'CONFIRMED' }).eq('id', orderId);
      await db.from('order_history').insert({ order_id: orderId, status:'CONFIRMED', note:'Customer will pay at shop on pickup.' });
    } catch(e) {
      console.error(e);
    }
    Cart.clear();
    try {
      if (currentCheckoutOrder) {
        sessionStorage.setItem('last_order', JSON.stringify(currentCheckoutOrder));
      }
    } catch(e) {}
    showSuccess(orderId, phone, 'Order saved. Bring cash or scan UPI QR at our counter when collecting.');
  }
